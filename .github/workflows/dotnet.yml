name: Validar projeto
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ShopeeMVC.sln
      - run: dotnet build ShopeeMVC.sln --configuration Release --no-restore
      - run: dotnet run --project tests/ShopeeMVC.Checks --configuration Release
